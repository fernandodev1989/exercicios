<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Impares</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Impares</h1>

            <p>Numeros impares</p>

            <label for="txt1">numero Inicial:</label>

            <input type="number" id="txtInicial">

            <label for="txt1">numero Final:</label>

            <input type="number" id="txtFinal">

            <button onclick="botao_click()">Calcular</button>

        </div>
    </div>

    <script>

        function botao_click() {

            var txtNumeroInicial = document.getElementById("txtInicial").value;
            var txtNumeroFinal = document.getElementById("txtFinal").value;

            var inicial = parseInt(txtNumeroInicial);
            var final = parseInt(txtNumeroFinal);

            var soma = 0;

            for (var i = inicial; i <= final; i++) {
                var resto = i % 2;

                if (resto > 0) {
                    soma = soma + i;
                }

            
            }
            alert("A soma dos impares é " + soma);
        }

    </script>

</body>
</html>
