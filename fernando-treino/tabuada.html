<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Tabuada</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Tabuada</h1>

            <p></p>

            <label for="txt1">Digite a tabuada:</label>
            
            <input type="number" id="txtTabuada">

            <button onclick="botao_click()">Exibir Tabuada</button>

        </div>
    </div>

    <script>

        function botao_click() {

            textoTabuada = document.getElementById("txtTabuada").value;
            tabuadaNumero = parseInt(textoTabuada);

            var mensagem = "A tabuada do número " + tabuadaNumero + " é: \r";

            for (var i = 1; i <= 10; i++) {

                var calculo = i * tabuadaNumero;

                var tabuadaAtual = i + " x " + tabuadaNumero + " = " + calculo + "\r";

                mensagem = mensagem + tabuadaAtual;

               

            }
            alert(mensagem);
        }

    </script>

</body>
</html>
