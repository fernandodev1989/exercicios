<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Boa noite</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Boa noite</h1>

            <p>Informe a hora atual</p>

            <label for="txt1">Digite aqui:</label>
            
            <input type="number" id="txtHoras">

            <button onclick="botao_click()">Exibir</button>

        </div>
    </div>

    <script>

        function botao_click() {

            var txtHora = document.getElementById("txtHoras").value;
            var hora = parseFloat(txtHora);

            if (hora >= 18) {
                alert("Boa noite!");

            }
            else if (hora > 12) {
                alert("Boa tarde!");
            }

            else {
                alert("Bom dia!");
            }


        }

    </script>

</body> 
</html>
