<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Glicose</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Quantidade de Glicose</h1>

            <p>Digite abaixo</p>

            <label for="txt1">Glicose em mg/dl:</label>
            
            <input type="text" id="txtGlicose">

            <button onclick="botao_click()">Resultado</button>

        </div>
    </div>

    <script>

        function botao_click() {
            var txtMedidaGlicose = document.getElementById("txtGlicose").value;
            var medidaGlicose = parseFloat(txtMedidaGlicose);

            if (medidaGlicose <= 100) {
                alert("Normal");
            }
            else if (medidaGlicose > 100 && medidaGlicose <= 140) {
                alert("Elevado");
            }
            else {
                alert("Diabetes");
            }
      
        }

    </script>

</body>
</html>
