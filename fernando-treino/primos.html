<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>primos</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Exibir Primos</h1>

            <p>Digite um numero e descubra os primos</p>

            <label for="txt1">Caixa de Texto:</label>
            
            <input type="number" id="txtFinal">

            <button onclick="botao_click()">Botão</button>

        </div>
    </div>

    <script>

        function botao_click() {

            var textoFinal = document.getElementById("txtFinal").value;
            var numerofinal = parseInt(textoFinal);

            var mensagem = " Os numeros primos são: \r";

            for (var i = 2; i <= numerofinal; i++) {

                var primo = true;

                var numero = i;

                for (var j = 2; j < numero; j++) {

                    var resto = numero % j;

                    if (resto == 0) {
                        primo = false;

                    }
                    
                }
                if (primo) {
                    mensagem += numero + "\r";
                }
            }
            alert(mensagem);
        }

    </script>

</body>
</html>
