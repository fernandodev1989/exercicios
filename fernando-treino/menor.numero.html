<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Menor número</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Menor númeto</h1>

            <p>Digite 3 números abaixo e descubra o menor número:</p>

            <label for="txt1">Número 1:</label><input type="text" id="txtNumero1">

            <label for="txt1">Número 2:</label><input type="text" id="txtNumero2">

            <label for="txt1">Número 3:</label><input type="text" id="txtNumero3">

            <button onclick="botao_click()">Botão</button>

        </div>
    </div>

    <script>

        function botao_click() {

            var numero1Texto = document.getElementById("txtNumero1").value
            var numero2Texto = document.getElementById("txtNumero2").value
            var numero3Texto = document.getElementById("txtNumero3").value

            var numero1 = parseInt(numero1Texto);
            var numero2 = parseInt(numero2Texto);
            var numero3 = parseInt(numero3Texto);

            if (numero1 < numero2 && numero1 < numero3) {
                alert("O menor número é o " + numero1);
            }
            else if (numero2 < numero1 && numero2 < numero3) {
                alert("O menor número e o " + numero2);
            }

             else {
                alert("O menor número é o " + numero3);
            }
                
          

        }

    </script>

</body>
</html>
