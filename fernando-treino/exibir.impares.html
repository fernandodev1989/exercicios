<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Exibir impares</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Exibir impares</h1>

            <p></p>

            <label for="txt1">Digite o número final:</label>

            <input type="number" id="txtNumeroFinal">

            <button onclick="botao_click()">Mostrar impares</button>

        </div>
    </div>

    <script>

        function botao_click() {

            var txtFinal = document.getElementById("txtNumeroFinal").value;
            var numeroCx = parseInt(txtFinal);

            var mensagem = "Os impares são: \r";

            for (var i = 1; i <= numeroCx; i++) {
                var resto = i % 2;

                if (resto > 0) {
                    mensagem = mensagem + i + "\r";
                }

            }
            alert(mensagem);
        }

    </script>

</body>
</html>
