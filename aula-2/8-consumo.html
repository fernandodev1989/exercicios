<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Consumo</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Consumo</h1>

            <p></p>

            <label for="txt1">Digite a distância percorrida (em km):</label>

            <input type="number" id="caixaDeTexto1">

            <label for="txt1">Digite o total de combustível gasto (em litros):</label>

            <input type="number" id="caixaDeTexto2">


            <button onclick="botao_click()">Calcular</button>

        </div>
    </div>

    <script>

        function botao_click() {

            //você irá programar aqui!

            var caixa1 = document.getElementById("caixaDeTexto1").value;
            var numero1 = parseInt(caixa1);

            var caixa2 = document.getElementById("caixaDeTexto2").value;
            var numero2 = parseInt(caixa2);

            var soma = numero1 / numero2;

            var mensagem = "O consumo médio do veiculo é de " + soma + "km por litro";

            alert(mensagem)

        }

    </script>

</body>
</html>
