<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Troco</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Troco</h1>

            <p></p>

            <label for="txt1">Digite o preço unitário do produto: R$</label>

            <input type="number" id="caixaDeTexto1">

            <label for="txt1">Digite a quantidade de unidades compradas:</label>

            <input type="number" id="caixaDeTexto2">

            <label for="txt1">Digite o valor dado pelo cliente: R$</label>

            <input type="number" id="caixaDeTexto3">


            <button onclick="botao_click()">Calcular</button>

        </div>
    </div>

    <script>

        function botao_click() {
      

            var caixa1 = document.getElementById("caixaDeTexto1").value;
            var numero1 = parseFloat(caixa1);

            var caixa2 = document.getElementById("caixaDeTexto2").value;
            var numero2 = parseFloat(caixa2);

            var caixa3 = document.getElementById("caixaDeTexto3").value;
            var numero3 = parseFloat(caixa3);

            var soma1 = numero1 * numero2;
            var soma2 = soma1 - numero3;

            

            var mensagem = "o troco do cliente é de R$" + soma2;

            alert(mensagem)


        }

    </script>

</body>
</html>
