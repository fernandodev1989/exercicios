<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Minha Tela cadastro</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <h1>Cadastro</h1>

    <img src="C:\aulas.hot.GAVA\logo.png" width="250" height="150" />

    <form>
        <label for="txtNome">Nome:</label>
        <input type="text" id="txtNome" />
        <br />

        <label for="txtSobrenome">Sobrenome:</label>
        <input type="text" id="txtSobrenome" />
        <br />

        <label for="txtCpf">CPF:</label>
        <input type="number" id="txtCpf" />
        <br />

        <label for="txtEmail">E-mail:</label>
        <input type="email" id="txtEmail" />
        <br />

        <label for="slcOpcoes">Caixa de seleção</label>

            <option>Feminino</option>
            <option>Masculino</option>
        </select>
        <br />

        <label for="txtSenha">Digite sue senha:</label>
        <input type="password" id="txtNome" />

        <br />

        <button>Cadastrar</button>
        <br />

        <a href="C:\aulas.hot.GAVA\aula-5\00-tela5login.html">Fazer login</a>
    </form>

</html>
