<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Glicose</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Glicose</h1>

            <p></p>

            <label for="txt1">Digite a quantidade de glicose no sangue:</label>
            
            <input type="number" id="txtValorGlicose">

            <button onclick="botao_click()">Calcular</button>

        </div>
    </div>

    <script>

        function botao_click() {

            //você irá programar aqui!

            var calculoGlicose = document.getElementById("txtValorGlicose").value;
            var medidaGlicose = parseFloat(calculoGlicose);

            if (medidaGlicose <= 100) {
                alert("Normal");
            } else if (medidaGlicose > 100 && medidaGlicose <= 140) {
                alert("Elevado");
            } else {
                alert("Diabetes");
            }
        }

    </script>

</body>
</html>
