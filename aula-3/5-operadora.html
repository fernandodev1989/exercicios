<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Operadora</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Operadora</h1>

            <p></p>

            <label for="txt1">Digite quantos minutos você consumiu:</label><input type="number" id="txt1MinutosConsumidos">
            
            

            <button onclick="botao_click()">Calcular</button>

        </div>
    </div>

    <script>

        function botao_click() {

            var txtMintosConsumidos = document.getElementById("txt1MinutosConsumidos").value;
            var minutosConsumidos = parseFloat(txtMintosConsumidos);
            var minutosPlano = 100;         
            var valorPlano = 50;
            var valorMinutoExcedente = 2;
            var valorTotal;

            if (minutosConsumidos > minutosPlano) {
                var minutosExcedentes = minutosConsumidos - minutosPlano;
                var valorMinutoExcedente = minutosExcedentes * valorMinutoExcedente;
                valorTotal = valorPlano + valorMinutoExcedente;

            }
            else {
                valorTotal = valorPlano;
            }
            alert("o valor da sua fatura será de R$ " + valorTotal);

        }

    </script>

</body>
</html>
