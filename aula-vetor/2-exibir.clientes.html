<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>clientes</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Exibir clientes</h1>
           
            <button onclick="botao_click()">Exibir clientes</button>

        </div>
    </div>

    <script>
        var clientes = ["Fernando", "Julia", "Livia", "José", "Silesia", "Nayelle"];

       
        function botao_click() {

            for (var i = 0; i < clientes.length; i++) {

                var cliente = clientes[i];

                alert(cliente);
            }

            var todosClientes = clientes.toLocaleString();

            alert(todosClientes);
        }
    </script>

</body>
</html>
