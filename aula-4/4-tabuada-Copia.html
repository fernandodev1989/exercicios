<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Tabuadacopia</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Tabuada Copia</h1>

            <p>Digite aqui a tabuada:</p>

            <label for="txt1">TabuadaDois:</label> <input type="number" id="txtTabuada2">

            <button onclick="botao_click()">Calcular</button>

        </div>
    </div>

    <script>

        function botao_click() {

            //você irá programar aqui!
            var mensagem = " O valor da tabuada " + tabuada + " é: \r";

            var tabuadaTexto = document.getElementById("txtTabuada2").value;
            //tabuada é o valor digitado.
            var tabuada = parseInt(tabuadaTexto);
            // var i = variavel contadora.
            // i++ incremento de soma mais 1 a cada volta.
            // for é usado para repetir uma ação várias vezes.
            for (var i = 1; i <= 10; i++) {

                var calculo = i * tabuada;

                var tabuadaAtual = i + " x " + tabuada + " = " + calculo + "\r";

                mensagem = mensagem + tabuadaAtual

            }

            alert(mensagem)
        }

    </script>

</body>
</html>
