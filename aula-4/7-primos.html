<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Numeros primos</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Mostrar primos</h1>

            <p></p>

            <label for="txt1">Digite o número:</label>

            <input type="text" id="txtPrimo">

            <button onclick="botao_click()">Exibir primos</button>

        </div>
    </div>

    <script>

        function botao_click() {

            var primoTexto = document.getElementById("txtPrimo").value;

            var final = parseFloat(primoTexto);

            var mensagem = "Esses são números primos: \r";

            // Percorre de 2 até o número digitado
            for (var i = 2; i <= final; i++) {
                var ePrimo = true;

                // Verifica se o número 'i' tem algum divisor entre 2 e a raiz quadrada dele
                for (var divisor = 2; divisor <= Math.sqrt(i); divisor++) {
                    if (i % divisor === 0) {
                        ePrimo = false; // Se dividiu por alguém, não é primo
                        break;
                    }
                }

                if (ePrimo) {
                    mensagem += i + "\n";
                }
            }

            alert(mensagem);
        }




    </script>

</body>
</html>
