<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Impares</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Impares</h1>

            <p>Digite o intervalo de números abaixo para somar os ìmpares:</p>

            <label for="txt1">Digite o numero inicial:</label><input type="number" id="txtInicial">

            <label for="txt1">Digite o número final:</label><input type="number" id="txtFinal">

            <button onclick="botao_click()">Calcular</button>

        </div>
    </div>

    <script>

        function botao_click() {


           var inicialTexto = document.getElementById("txtInicial").value;

           var finalTexto = document.getElementById('txtFinal').value;

           var inicial = parseInt(inicialTexto);

           var final = parseInt(finalTexto);

           var soma = 0;
           //Em termos simples: se você divide um número por outro e a conta não é exata, o que sobra é o resto.
           //O atributo "resto" (geralmente representado pelo operador %) 7/2 = 3 sobra 1 esse e o resto.

           for (var i = inicial; i <= final; i++) {

               var resto = i % 2;

               if (resto > 0) {
                   //quer dizer q é impar
                   soma = soma + i;
               }
         }

          alert("A soma dos números ímpares" + soma);

        }
 
    </script>

</body>
</html>
